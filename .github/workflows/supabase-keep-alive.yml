name: Supabase keep alive

on:
  schedule:
    - cron: "13 2,10,18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Query Supabase PostgreSQL health check
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" \
            --command "select id from public.health_check limit 1;" \
            --no-align \
            --tuples-only
